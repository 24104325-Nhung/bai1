<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh tương tác</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        /* Khung hiển thị ảnh chính ở trên */
        #image {
            line-height: 300px;
            width: 575px;
            height: 300px;
            border: 5px solid black;
            margin: 0 auto 20px auto;
            background-color: #8e8e8e;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
        }

        /* Danh sách các ảnh thu nhỏ ở dưới */
        .preview {
            width: 100px;
            height: 100px;
            margin: 10px;
            border: 2px solid black;
            cursor: pointer;
            object-fit: cover;
        }

        .preview:hover {
            border-color: red;
        }
    </style>
</head>
<body>

    <h1>Thư viện ảnh tương tác</h1>

    <!-- Khung chính hiển thị thông tin và hình ảnh -->
    <div id="image">
        Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
    </div>

    <!-- Các hình ảnh nhỏ phía dưới -->
    <!-- Khi di chuột vào (onmouseover) sẽ gọi hàm upDate, khi di chuột ra (onmouseout) sẽ gọi hàm unDo -->
    <img class="preview" 
         alt="Cánh đồng hoa hướng dương" 
         src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?w=500" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <img class="preview" 
         alt="Bình minh trên biển" 
         src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <img class="preview" 
         alt="Rừng cây mùa thu" 
         src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <!-- Dòng liên kết tới file script.js của chị -->
    <script src="script.js"></script>
</body>
</html>
